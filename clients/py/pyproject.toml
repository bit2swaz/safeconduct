[project]
name = "safeconduct"
version = "0.1.0"
description = "Rules for safeconduct, the replay browser for AI agents: start a run, check rules after every step"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["browser", "agents", "replay", "testing", "cdp", "browser-use"]

[project.urls]
Repository = "https://github.com/bit2swaz/safeconduct"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["safeconduct.py"]

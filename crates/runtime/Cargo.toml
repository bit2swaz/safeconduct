[package]
name = "safeconduct"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Deterministic replay browser for AI agents: record a run, replay it exactly, fuzz it, check rules, shrink failures"
repository = "https://github.com/bit2swaz/safeconduct"
readme = "../../README.md"
keywords = ["browser", "agents", "replay", "testing", "cdp"]
categories = ["development-tools::testing", "command-line-utilities"]

[[bin]]
name = "safeconduct"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30"

[package]
name = "safeconduct-runtime"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Deterministic replay browser for AI agents"

[[bin]]
name = "safeconduct"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
futures-util = "0.3.34"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30"
